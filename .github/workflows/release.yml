name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Compile and Bundle App
      run: |
        chmod +x ./build.sh
        ./build.sh
        # Run selftest to ensure clean binary
        ./VibeGauge.app/Contents/MacOS/VibeGauge --selftest

    - name: Package Zip
      run: |
        # Use ditto to preserve macOS metadata and code signatures
        ditto -c -k --sequesterRsrc --keepParent VibeGauge.app VibeGauge.zip
        shasum -a 256 VibeGauge.zip > VibeGauge.zip.sha256

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          VibeGauge.zip
          VibeGauge.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
